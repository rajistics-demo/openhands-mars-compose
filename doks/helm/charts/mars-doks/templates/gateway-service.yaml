apiVersion: v1
kind: Service
metadata:
  name: {{ include "mars-doks.fullname" . }}-gateway
  labels:
    {{- include "mars-doks.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  selector:
    app.kubernetes.io/name: mars-doks
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8100
      targetPort: 8100
